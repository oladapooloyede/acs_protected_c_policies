---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pc-secret-access
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-protected-c-policies
    protected-c.policy.local/stage: audit
  annotations:
    protected-c.policy.local/itsg33-controls: "AC-3, AU-2, AU-6, AU-12, IA-5"
    protected-c.policy.local/recommended-enforcement: "none - ACS forbids enforcement on audit log policies"
    protected-c.policy.local/tuning-required: "true"
    protected-c.policy.local/prerequisite: >-
      Requires the OpenShift audit log collection to be enabled on the secured
      cluster. Without it this policy never fires.
spec:
  policyName: "Protected C - Secret Read Or Modified Through The API"
  description: >-
    Alerts when a Secret in a Protected C namespace is read or modified through the
    Kubernetes API by a principal that is not on the expected platform allowlist.
  rationale: >-
    Secrets in a Protected C namespace protect the information itself. Every read is
    a credential disclosure event that must be attributable to a named principal and
    reviewable after the fact, which is exactly what the audit log provides.
  remediation: >-
    Confirm the principal and the business reason. Restrict get and list on secrets to
    the minimum set of service accounts, prefer projected or vault-sourced secrets
    over direct API reads, and rotate any secret read by an unexpected principal.
  categories:
    - "Kubernetes Events"
    - "Anomalous Activity"
  lifecycleStages:
    - RUNTIME
  eventSource: AUDIT_LOG_EVENT
  severity: HIGH_SEVERITY
  scope:
    # TUNE ME: restrict to the namespaces that actually hold Protected C secrets.
    # Without a scope this policy is extremely noisy on a real cluster.
    - namespace: "protected-c-.*"
  policySections:
    - sectionName: "Secret accessed by an unexpected principal"
      policyGroups:
        - fieldName: "Kubernetes Resource"
          booleanOperator: OR
          values:
            - value: "SECRETS"
        - fieldName: "Kubernetes API Verb"
          booleanOperator: OR
          values:
            - value: "GET"
            - value: "CREATE"
            - value: "UPDATE"
            - value: "PATCH"
            - value: "DELETE"
        # TUNE ME: exact service account names only. This field does not accept
        # wildcards, so each expected principal must be listed in full.
        - fieldName: "Kubernetes User Name"
          booleanOperator: OR
          negate: true
          values:
            - value: "system:apiserver"
            - value: "system:kube-controller-manager"
  mitreAttackVectors:
    - tactic: "TA0006"
      techniques:
        - "T1552.007"
