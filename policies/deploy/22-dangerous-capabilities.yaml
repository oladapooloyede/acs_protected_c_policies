---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pc-dangerous-capabilities
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-protected-c-policies
    protected-c.policy.local/stage: deploy
  annotations:
    protected-c.policy.local/itsg33-controls: "AC-6, AC-6(10), CM-7"
    protected-c.policy.local/recommended-enforcement: "SCALE_TO_ZERO_ENFORCEMENT"
spec:
  policyName: "Protected C - Dangerous Linux Capability Added"
  description: >-
    Alerts when a container requests a Linux capability that can be used to escape the
    container, tamper with the kernel, manipulate node networking or read arbitrary
    files on the host.
  rationale: >-
    Capabilities such as SYS_ADMIN, SYS_MODULE, SYS_PTRACE, NET_ADMIN and
    DAC_READ_SEARCH each provide a documented container escape or host inspection
    path. Granting them to a Protected C workload removes the isolation the
    accreditation depends on.
  remediation: >-
    Drop all capabilities and add back only the minimum the workload provably needs.
    Most applications need none. If a capability on this list is unavoidable, it
    requires a documented risk acceptance from the security authority.
  categories:
    - "Privileges"
  lifecycleStages:
    - DEPLOY
  severity: CRITICAL_SEVERITY
  policySections:
    - sectionName: "High risk capability requested"
      policyGroups:
        - fieldName: "Add Capabilities"
          booleanOperator: OR
          values:
            - value: "SYS_ADMIN"
            - value: "SYS_MODULE"
            - value: "SYS_PTRACE"
            - value: "SYS_RAWIO"
            - value: "SYS_BOOT"
            - value: "SYS_TIME"
            - value: "NET_ADMIN"
            - value: "NET_RAW"
            - value: "DAC_READ_SEARCH"
            - value: "DAC_OVERRIDE"
            - value: "SETUID"
            - value: "SETGID"
            - value: "MAC_ADMIN"
            - value: "MAC_OVERRIDE"
            - value: "MKNOD"
            - value: "AUDIT_CONTROL"
            - value: "AUDIT_WRITE"
            - value: "SYSLOG"
            - value: "LINUX_IMMUTABLE"
            - value: "IPC_LOCK"
            - value: "IPC_OWNER"
            - value: "SYS_CHROOT"
            - value: "SYS_RESOURCE"
            - value: "SYS_PACCT"
            - value: "BLOCK_SUSPEND"
            - value: "WAKE_ALARM"
            - value: "LEASE"
  mitreAttackVectors:
    - tactic: "TA0004"
      techniques:
        - "T1611"
