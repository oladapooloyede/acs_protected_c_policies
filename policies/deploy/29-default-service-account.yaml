---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pc-default-service-account
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-protected-c-policies
    protected-c.policy.local/stage: deploy
  annotations:
    protected-c.policy.local/itsg33-controls: "AC-2, AC-6, IA-2, IA-9"
    protected-c.policy.local/recommended-enforcement: "SCALE_TO_ZERO_ENFORCEMENT"
spec:
  policyName: "Protected C - Default Service Account Or Automounted Token"
  description: >-
    Alerts when a workload runs under the default service account, or when it
    automounts a service account token that it does not need.
  rationale: >-
    The default service account is shared and unattributable, which breaks the
    identity and audit trail Protected C requires. An automounted token placed in a
    pod that never calls the API is a credential sitting in reach of any process that
    compromises the container.
  remediation: >-
    Create a dedicated service account per workload and set
    automountServiceAccountToken to false unless the workload calls the Kubernetes
    API. Where the API is needed, bind the minimum namespace-scoped Role.
  categories:
    - "Privileges"
    - "Security Best Practices"
  lifecycleStages:
    - DEPLOY
  severity: HIGH_SEVERITY
  policySections:
    - sectionName: "Runs as the default service account"
      policyGroups:
        - fieldName: "Service Account"
          booleanOperator: OR
          values:
            - value: "default"
    - sectionName: "Service account token is automounted"
      policyGroups:
        - fieldName: "Automount Service Account Token"
          booleanOperator: OR
          values:
            - value: "true"
  mitreAttackVectors:
    - tactic: "TA0006"
      techniques:
        - "T1552.001"
