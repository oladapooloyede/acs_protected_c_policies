---
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: pc-secrets-in-environment
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-protected-c-policies
    protected-c.policy.local/stage: deploy
  annotations:
    protected-c.policy.local/itsg33-controls: "IA-5, IA-5(7), SC-28"
    protected-c.policy.local/recommended-enforcement: "SCALE_TO_ZERO_ENFORCEMENT"
spec:
  policyName: "Protected C - Credential In Plaintext Environment Variable"
  description: >-
    Alerts when a container declares an environment variable whose name suggests a
    secret and whose value is set literally in the manifest rather than sourced from a
    Secret reference.
  rationale: >-
    A plaintext credential in a pod specification is visible to anyone who can read
    the deployment, is captured in Git history and audit logs, and appears in process
    listings. At Protected C that is an uncontrolled disclosure of an authenticator.
  remediation: >-
    Move the value into a Kubernetes Secret backed by an external vault or the
    accredited secrets manager, and reference it with secretKeyRef or a mounted file.
    Rotate any credential that was ever committed in plaintext.
  categories:
    - "Security Best Practices"
  lifecycleStages:
    - DEPLOY
  severity: CRITICAL_SEVERITY
  policySections:
    - sectionName: "Secret-like variable set from a raw literal value"
      policyGroups:
        - fieldName: "Environment Variable"
          booleanOperator: OR
          values:
            - value: "RAW=.*(?i:secret|password|passwd|credential|token|api_?key|private_?key|access_?key|client_?secret).*="
  mitreAttackVectors:
    - tactic: "TA0006"
      techniques:
        - "T1552.001"
