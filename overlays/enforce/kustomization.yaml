---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Enforcing overlay. Adds blocking enforcement to every policy that supports it.
#
# Deliberately NOT enforced here:
#   pc-missing-network-policy  - ACS rejects enforcement on network policy criteria
#   pc-unexpected-network-flow - baseline driven, too easy to cause an outage
#   all policies under policies/audit/ - ACS forbids enforcement on audit log policies
#
# Do not apply this overlay until the detect-only baseline has run clean for at
# least one full business cycle. See docs/deployment-guide.md.

namespace: stackrox

resources:
  - ../../policies

patches:
  - target:
      group: config.stackrox.io
      version: v1alpha1
      kind: SecurityPolicy
      name: pc-unapproved-registry
    patch: |-
      - op: add
        path: /spec/enforcementActions
        value:
        - FAIL_BUILD_ENFORCEMENT
        - SCALE_TO_ZERO_ENFORCEMENT
  - target:
      group: config.stackrox.io
      version: v1alpha1
      kind: SecurityPolicy
      name: pc-unsigned-image
    patch: |-
